[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-warehouse"
version = "0.1.0"
description = "Synthetic People Analytics warehouse"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
workforce = "workforce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workforce = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
